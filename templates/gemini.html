<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gemini Chat · F&M</title>
  <style>
    body {
      font-family: sans-serif;
      background: linear-gradient(135deg, #e0e7ff, #e0f7fa, #d1fae5);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .chat-container {
      width: 100%;
      max-width: 600px;
      background: rgba(255,255,255,0.9);
      border-radius: 1.5rem;
      padding: 1rem;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      height: 80vh;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .message {
      padding: 0.5rem 0.75rem;
      border-radius: 0.75rem;
      max-width: 80%;
      word-wrap: break-word; /* Prevents long words from breaking layout */
    }

    .message.user {
      align-self: flex-end;
      background: #4f46e5;
      color: white;
      border-bottom-right-radius: 0;
    }

    .message.gemini {
      align-self: flex-start;
      background: #e2e8f0;
      color: #1e293b;
      border-bottom-left-radius: 0;
    }

    .controls {
      display: flex;
      justify-content: center;
      margin-top: 0.5rem;
    }

    .record-btn {
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      font-size: 1.5rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      transition: transform 0.2s, background 0.2s;
    }

    .record-btn:hover {
      transform: scale(1.1);
    }

    .record-btn.recording {
      background: #ef4444; /* Red when recording */
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="messages" id="messages">
      <div class="message gemini">Hi! I'm Misty. Click the mic to talk to me.</div>
    </div>

    <div class="controls">
      <button id="recordBtn" class="record-btn">🎤</button>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById("messages");
    const recordBtn = document.getElementById("recordBtn");

    let mediaRecorder;
    let audioChunks = [];
    let stream;

    // Helper to add messages to the chat safely
    function appendMessage(html, type) {
      const div = document.createElement('div');
      div.className = `message ${type}`;
      div.innerHTML = html;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div; // Return the element so we can remove it later if needed
    }

    // START talking (press)
    async function startRecording() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (err) {
        alert("Microphone access denied or not found.");
        return;
      }

      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];

      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
      mediaRecorder.start();

      // Visual feedback
      recordBtn.classList.add("recording");
      
      // Add a temporary status message
      const statusMsg = appendMessage("🎤 Listening...", "user");
      statusMsg.id = "temp-status"; // Tag it so we can find it
    }

    // STOP talking (release)
    async function stopRecording() {
      if (!mediaRecorder || mediaRecorder.state === "inactive") return;

      mediaRecorder.stop();
      recordBtn.classList.remove("recording");

      mediaRecorder.onstop = async () => {
        // Stop the microphone stream
        stream.getTracks().forEach(t => t.stop());

        // Update status
        const statusMsg = document.getElementById("temp-status");
        if (statusMsg) statusMsg.innerHTML = "🧠 Processing...";

        const audioBlob = new Blob(audioChunks, { type: "audio/wav" });
        const reader = new FileReader();

        reader.onloadend = async () => {
          const base64Audio = reader.result.split(',')[1];

          try {
            const res = await fetch("/stt", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ audio: base64Audio })
            });

            const data = await res.json();
            
            // Remove the temporary status message completely
            if (statusMsg) statusMsg.remove();

            if (data.text) {
              // 1. Show User Transcript (Right Side)
              appendMessage(data.text, "user");

              // 2. Send to Misty to speak
              await fetch("/speak", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ text: data.text })
              });
            } else {
               appendMessage("<i>(I didn't catch that)</i>", "gemini");
            }

          } catch (error) {
            console.error(error);
            if (statusMsg) statusMsg.remove();
            appendMessage("Error connecting to server.", "gemini");
          }
        };

        reader.readAsDataURL(audioBlob);
      };
    }

    // 🖱 Desktop Events
    recordBtn.addEventListener("mousedown", startRecording);
    recordBtn.addEventListener("mouseup", stopRecording);
    recordBtn.addEventListener("mouseleave", stopRecording); // Stop if mouse slides off button

    // 📱 Mobile Events
    recordBtn.addEventListener("touchstart", e => {
      e.preventDefault(); // Prevents mouse emulation
      startRecording();
    });
    recordBtn.addEventListener("touchend", e => {
      e.preventDefault();
      stopRecording();
    });
  </script>

</body>
</html>
