<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Misty Gemini Interface</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; padding: 40px; background: #f0f2f5; }
        .container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .mic-btn { font-size: 60px; cursor: pointer; border: 4px solid #4f46e5; border-radius: 50%; width: 120px; height: 120px; background: white; transition: all 0.3s; }
        .mic-btn.active { background: #fee2e2; border-color: #ef4444; transform: scale(1.1); }
        #transcript { margin-top: 20px; font-size: 1.2rem; min-height: 1.5em; }
        .back-btn { margin-top: 30px; padding: 10px 20px; border: none; background: #4f46e5; color: white; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Misty Voice Assistant</h1>
        <p>Press the mic and speak to Misty</p>
        
        <button id="micBtn" class="mic-btn" onclick="toggleMic()">🎤</button>
        
        <div id="transcript" style="color: #64748b; font-style: italic;">Ready...</div>
        
        <button class="back-btn" onclick="stopAndGoHome()">← Back to Home</button>
    </div>

    <script>
        let isRecording = false;

        async function toggleMic() {
            const btn = document.getElementById("micBtn");
            const display = document.getElementById("transcript");
            
            if (!isRecording) {
                // START RECORDING
                isRecording = true;
                btn.classList.add("active");
                display.innerText = "Misty is listening...";
                display.style.color = "#ef4444";
                await fetch('/misty/start_listening', { method: 'POST' });
            } else {
                // STOP AND PROCESS
                isRecording = false;
                btn.classList.remove("active");
                display.innerText = "Analyzing audio...";
                display.style.color = "#64748b";
                
                const response = await fetch('/misty/stop_and_process', { method: 'POST' });
                const data = await response.json();

                // --- UI FILTER (Prevents Gray Motor Noise) ---
                const junkPhrases = ["silence", "motor noise", "noise", "static", "background", "I didn't hear anything"];
                
                let isJunk = false;
                if (data.text) {
                    isJunk = junkPhrases.some(phrase => data.text.toLowerCase().includes(phrase));
                }

                if (data.text && !isJunk) {
                    display.innerText = "Misty heard: " + data.text;
                    display.style.color = "#1e293b"; // Make real text dark/visible
                } else {
                    display.innerText = ""; // Hide technical noise or "I didn't hear anything"
                }
            }
        }

        function stopAndGoHome() {
            // Tell server to stop speaking then redirect
            fetch("/stop", { method: "POST" }).then(() => {
                window.location.href = "/";
            });
        }
    </script>
</body>
</html>
