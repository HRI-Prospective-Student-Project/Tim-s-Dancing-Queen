<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misty | Gemini Mic</title>
    <script src="{{ url_for('static', filename='tailwind.min.js') }}"></script>
    <script src="{{ url_for('static', filename='feather.min.js') }}"></script>
    <script src="{{ url_for('static', filename='global.js') }}"></script>
    <style>
        /* Hidden scrollbar but functional scrolling */
        #chat-container::-webkit-scrollbar { display: none; }
        #chat-container { 
            -ms-overflow-style: none; 
            scrollbar-width: none; 
            scroll-behavior: smooth;
        }
        /* Fix for long words/files breaking layout */
        .message-text {
            overflow-wrap: break-word;
            word-wrap: break-word;
            white-space: pre-wrap; /* CRITICAL: Maintains line breaks from test files */
        }
    </style>
</head>
<body class="bg-slate-900 text-white font-sans h-screen flex flex-col overflow-hidden" onload="initGeminiPage()">

    <div class="w-full p-6 border-b border-slate-700 bg-slate-800 flex justify-between items-center shadow-lg relative z-10">
        <div class="flex items-center gap-4">
        <a href="javascript:void(0)" onclick="handleNav('Exit to Home', '/home')">Home</a>     
            </a>
            <h1 class="text-2xl font-bold flex gap-2 items-center">
                <i data-feather="mic" class="text-indigo-400"></i> Talk to Misty
            </h1>
        </div>
        <div class="flex flex-col items-end">
            <span id="status" class="text-sm font-black tracking-widest text-indigo-400">IDLE</span>
            <p class="text-[10px] text-slate-500 uppercase tracking-tighter">Gemini 2.5 Flash System</p>
        </div>
    </div>

    <div id="chat-container" class="flex-1 w-full max-w-5xl mx-auto p-8 overflow-y-auto space-y-8">
        <div class="flex flex-col items-start w-full animate-in fade-in duration-500">
            <div class="bg-slate-800 p-6 rounded-2xl rounded-tl-none border border-slate-700 max-w-[85%] shadow-xl">
                <p class="font-black text-indigo-400 text-xs mb-2 uppercase tracking-widest">Misty</p>
                <p id="intro-message" class="text-slate-300 text-md leading-relaxed message-text">Hi! I'm Misty powered by Gemini. Press one of my stickers and start talking. Press it again when you're finished! Please do not share any identifiable personal information.</p>
            </div>
        </div>
    </div>

    <div class="w-full p-10 bg-gradient-to-t from-slate-900 via-slate-900 to-transparent flex flex-col items-center gap-6 relative z-10">
        
        <div id="status-orb" class="w-48 h-48 rounded-full border-8 border-slate-700 flex flex-col items-center justify-center transition-all duration-500 bg-slate-800 shadow-2xl">
            <i data-feather="mic" id="status-icon" class="w-16 h-16 text-slate-600 transition-all duration-500"></i>
            <span id="orb-label" class="text-[10px] font-black uppercase tracking-[0.3em] mt-2 text-slate-500">Standby</span>
        </div>

        <div class="text-center">
            <p id="instruction-main" class="text-2xl text-white font-black uppercase tracking-widest">
                Press Bumper to Talk
            </p>
            <div id="recording-wave" class="hidden flex gap-1 mt-4 justify-center">
                <div class="w-1 h-8 bg-red-500 animate-bounce" style="animation-delay: 0.1s"></div>
                <div class="w-1 h-12 bg-red-600 animate-bounce" style="animation-delay: 0.2s"></div>
                <div class="w-1 h-10 bg-red-400 animate-bounce" style="animation-delay: 0.3s"></div>
                <div class="w-1 h-14 bg-red-500 animate-bounce" style="animation-delay: 0.4s"></div>
            </div>
        </div>
    </div>
    
    <script>
        feather.replace();

        // New UI Elements
        const orb = document.getElementById('status-orb');
        const icon = document.getElementById('status-icon');
        const label = document.getElementById('orb-label');
        const instructionMain = document.getElementById('instruction-main');
        const wave = document.getElementById('recording-wave');
        const chat = document.getElementById('chat-container');
        const statusHeader = document.getElementById('status');

        let isListening = false;

        function initGeminiPage() {
            if (typeof logInteraction === 'function') {
                logInteraction("PAGE_ENTER", "User entered Gemini Bumper Interface");
            }
            autoIntro();
            
            // IMPORTANT: Here you would normally start a "listener" for the bumper.
            // For now, I will leave the functions ready to be called by your server.
        }

        function autoIntro() {
            const introText = document.getElementById('intro-message').innerText;
            setTimeout(() => {
                if (typeof speakText === 'function') speakText(introText);
            }, 800);
        }

        // Call this function when the Bumper is first pressed
        function startListeningUI() {
            isListening = true;
            
            // Header Status
            statusHeader.innerText = "LISTENING...";
            statusHeader.classList.replace('text-indigo-400', 'text-red-500');

            // Orb Visuals (Red/Pulse)
            orb.classList.replace('border-slate-700', 'border-red-600');
            orb.classList.add('shadow-[0_0_60px_rgba(220,38,38,0.4)]', 'animate-pulse');
            icon.classList.replace('text-slate-600', 'text-red-500');
            
            // Text & Wave
            label.innerText = "Recording";
            label.classList.replace('text-slate-500', 'text-red-400');
            instructionMain.innerText = "Misty is Listening...";
            wave.classList.remove('hidden');

            if (typeof stopSpeech === 'function') stopSpeech();
        }

        // Call this function when the Bumper is released or processing starts
        function stopAndThinkUI() {
            isListening = false;

            // Header Status
            statusHeader.innerText = "THINKING...";
            statusHeader.classList.replace('text-red-500', 'text-amber-400');

            // Orb Visuals (Yellow/Thinking)
            orb.classList.remove('animate-pulse');
            orb.classList.replace('border-red-600', 'border-amber-500');
            orb.classList.replace('shadow-[0_0_60px_rgba(220,38,38,0.4)]', 'shadow-[0_0_60px_rgba(245,158,11,0.3)]');
            
            icon.classList.replace('text-red-500', 'text-amber-400');
            icon.setAttribute('data-feather', 'cpu'); 
            feather.replace(); 
            
            label.innerText = "Thinking";
            label.classList.replace('text-red-400', 'text-amber-400');
            
            instructionMain.innerText = "Processing Speech...";
            wave.classList.add('hidden');
        }

        function appendMessage(sender, text) {
            const isUser = sender === 'user';
            const alignment = isUser ? 'items-end' : 'items-start';
            const bgColor = isUser ? 'bg-indigo-600' : 'bg-slate-800 border border-slate-700';
            const rounded = isUser ? 'rounded-tr-none' : 'rounded-tl-none';
            const labelText = isUser ? '' : '<p class="font-black text-indigo-400 text-xs mb-2 uppercase tracking-widest">Misty</p>';
            const maxWidth = isUser ? 'max-w-[80%]' : 'max-w-[95%] w-full';

            const messageDiv = document.createElement('div');
            messageDiv.className = `flex flex-col ${alignment} w-full animate-in fade-in slide-in-from-bottom-4 duration-500`;
            messageDiv.innerHTML = `
                <div class="${bgColor} p-6 rounded-3xl ${rounded} ${maxWidth} shadow-2xl">
                    ${labelText}
                    <p class="text-md leading-relaxed message-text">${text}</p>
                </div>
            `;
            chat.appendChild(messageDiv);
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
