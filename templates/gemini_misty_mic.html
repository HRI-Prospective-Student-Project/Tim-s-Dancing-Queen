<!DOCTYPE html>
<html lang="en">
<head>
    <title>Misty | Gemini Mic</title>
    <script src="{{ url_for('static', filename='tailwind.min.js') }}"></script>
    <script src="{{ url_for('static', filename='feather.min.js') }}"></script>
    <script src="{{ url_for('static', filename='global.js') }}"></script>
    <style>
        #chat-container::-webkit-scrollbar { display: none; }
        #chat-container { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-900 text-white font-sans h-screen flex flex-col overflow-hidden" onload="initGeminiPage()">

    <div class="w-full p-6 border-b border-slate-700 bg-slate-800 flex justify-between items-center shadow-lg">
        <div class="flex items-center gap-4">
            <a href="/" onclick="handleNav('Gemini: Exit to Home')" class="p-2 hover:bg-slate-700 rounded-full transition-colors">
                <i data-feather="arrow-left"></i>
            </a>
            <h1 class="text-2xl font-bold flex gap-2 items-center">
                <i data-feather="mic" class="text-indigo-400"></i> Talk to Misty
            </h1>
        </div>
        <div class="flex flex-col items-end">
            <span id="status" class="text-sm font-black tracking-widest text-indigo-400">IDLE</span>
            <p class="text-[10px] text-slate-500 uppercase">Gemini 1.5 Flash System</p>
        </div>
    </div>

    <div id="chat-container" class="flex-1 w-full max-w-5xl mx-auto p-8 overflow-y-auto space-y-6">
        <div class="flex flex-col items-start">
            <div class="bg-slate-800 p-4 rounded-2xl rounded-tl-none border border-slate-700 max-w-[70%] shadow-lg">
                <p id="intro-message" class="text-slate-300">Hi! I'm Misty powered by Gemini. Tap the microphone to start talking. Tap it again when you're finished! Please do not share any identifiable personal information</p>
            </div>
        </div>
    </div>

    <div class="w-full p-10 bg-gradient-to-t from-slate-900 via-slate-900 to-transparent flex flex-col items-center gap-4">
        <button id="mic-btn" 
            class="w-24 h-24 bg-indigo-600 rounded-full flex items-center justify-center shadow-[0_0_30px_rgba(79,70,229,0.4)] hover:bg-indigo-500 hover:scale-105 transition-all active:scale-90 select-none touch-none">
            <i data-feather="mic" class="w-10 h-10 text-white"></i>
        </button>
        <p id="instruction" class="text-sm text-slate-400 font-bold uppercase tracking-tighter">Tap to Speak</p>
    </div>
    
    <script>
        feather.replace();
        const micBtn = document.getElementById('mic-btn');
        const status = document.getElementById('status');
        const chat = document.getElementById('chat-container');
        const instruction = document.getElementById('instruction');

        // TRACKING STATE
        let isListening = false;

        function initGeminiPage() {
            if (typeof logInteraction === 'function') {
                logInteraction("PAGE_ENTER", "User entered Gemini Toggle Interface");
            }
            autoIntro();
        }

        function autoIntro() {
            const introText = document.getElementById('intro-message').innerText;
            setTimeout(() => {
                if (typeof speakText === 'function') speakText(introText);
            }, 1000);
        }

        // TOGGLE LOGIC
        micBtn.onclick = () => {
            if (!isListening) {
                startListening();
            } else {
                stopAndProcess();
            }
        };

        function startListening() {
            isListening = true;
            if (typeof logInteraction === 'function') logInteraction("MIC_TOGGLE_START", "User began speaking");
            if (typeof stopSpeech === 'function') stopSpeech(); 

            status.innerText = "LISTENING...";
            status.classList.replace('text-indigo-400', 'text-red-500');
            instruction.innerText = "Misty is listening... Tap to stop";
            
            // Visual Feedback: Turn Red and Pulse
            micBtn.classList.add('ring-4', 'ring-red-500/50', 'bg-red-600', 'animate-pulse');
            
            fetch('/misty/start_listening', { method: 'POST' });
        }

        function stopAndProcess() {
            isListening = false;
            if (typeof logInteraction === 'function') logInteraction("MIC_TOGGLE_STOP", "User finished speaking");

            status.innerText = "THINKING...";
            status.classList.replace('text-red-500', 'text-amber-400');
            instruction.innerText = "Processing your request...";
            micBtn.classList.remove('ring-4', 'ring-red-500/50', 'bg-red-600', 'animate-pulse');

            fetch('/misty/stop_and_process', { 
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    sessionId: localStorage.getItem('robot_session_id') 
                })
            })
            .then(res => res.json())
            .then(data => {
                if (typeof logInteraction === 'function') {
                    logInteraction("GEMINI_EXCHANGE", `U: ${data.user_text} | M: ${data.misty_reply}`);
                }

                status.innerText = "IDLE";
                status.classList.remove('text-amber-400');
                status.classList.add('text-indigo-400');
                instruction.innerText = "Tap to Speak";
                
                // Add Messages to Chat
                appendMessage('user', data.user_text);
                setTimeout(() => appendMessage('misty', data.misty_reply), 600);
            })
            .catch(err => {
                status.innerText = "ERROR";
                instruction.innerText = "Try again.";
            });
        }

        function appendMessage(sender, text) {
            const isUser = sender === 'user';
            const alignment = isUser ? 'items-end' : 'items-start';
            const bgColor = isUser ? 'bg-indigo-600' : 'bg-slate-800 border border-slate-700';
            const rounded = isUser ? 'rounded-tr-none' : 'rounded-tl-none';
            const label = isUser ? '' : '<p class="font-black text-indigo-400 text-xs mb-2 uppercase tracking-widest">Misty</p>';

            chat.innerHTML += `
                <div class="flex flex-col ${alignment} w-full animate-in fade-in slide-in-from-bottom-2 duration-300">
                    <div class="${bgColor} p-4 rounded-2xl ${rounded} max-w-[70%] shadow-lg">
                        ${label}
                        <p class="text-md leading-relaxed">${text}</p>
                    </div>
                </div>
            `;
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
