<!DOCTYPE html>
<html lang="en">
<head>
    <title>Misty | Gemini Mic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/feather-icons"></script>
</head>
<body class="bg-slate-900 text-white font-sans h-screen flex flex-col items-center justify-center p-6">
    <div class="w-full max-w-2xl bg-slate-800 rounded-3xl shadow-2xl flex flex-col h-[80vh]">
        <div class="p-6 border-b border-slate-700 flex justify-between">
            <h1 class="text-xl font-bold flex gap-2"><i data-feather="mic"></i> Talk to Misty</h1>
            <span id="status" class="text-xs font-bold text-slate-400">IDLE</span>
        </div>
        <div id="chat-container" class="flex-1 p-6 overflow-y-auto space-y-4"></div>
        <div class="p-8 flex flex-col items-center gap-4 bg-slate-900/50">
            <button id="mic-btn" class="w-20 h-20 bg-indigo-600 rounded-full flex items-center justify-center hover:bg-indigo-500 transition-all active:scale-95">
                <i data-feather="mic" class="w-8 h-8"></i>
            </button>
            <p class="text-xs text-slate-500 font-bold uppercase">Hold to Speak</p>
        </div>
    </div>
    <script>
        feather.replace();
        const micBtn = document.getElementById('mic-btn');
        const status = document.getElementById('status');
        const chat = document.getElementById('chat-container');

        micBtn.onmousedown = () => {
            status.innerText = "LISTENING...";
            fetch('/misty/start_listening', { method: 'POST' });
        };
        micBtn.onmouseup = () => {
            status.innerText = "PROCESSING...";
            fetch('/misty/stop_and_process', { method: 'POST' })
                .then(res => res.json())
                .then(data => {
                    status.innerText = "IDLE";
                    chat.innerHTML += `
                        <div class="flex flex-col items-end"><div class="bg-indigo-600 p-3 rounded-2xl rounded-tr-none text-sm">${data.user_text}</div></div>
                        <div class="flex flex-col items-start"><div class="bg-slate-700 p-3 rounded-2xl rounded-tl-none text-sm"><p class="font-bold text-indigo-300">Misty</p>${data.misty_reply}</div></div>
                    `;
                    chat.scrollTop = chat.scrollHeight;
                });
        };
    </script>
</body>
</html>
