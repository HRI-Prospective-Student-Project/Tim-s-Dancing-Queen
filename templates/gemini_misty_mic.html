<!DOCTYPE html>
<html lang="en">
<head>
    <title>Misty | Gemini Mic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <script src="{{ url_for('static', filename='global.js') }}"></script>
    <style>
        #chat-container::-webkit-scrollbar { display: none; }
        #chat-container { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-900 text-white font-sans h-screen flex flex-col overflow-hidden" onload="initGeminiPage()">

    <div class="w-full p-6 border-b border-slate-700 bg-slate-800 flex justify-between items-center shadow-lg">
        <div class="flex items-center gap-4">
            <a href="/" onclick="handleNav('Gemini: Exit to Home')" class="p-2 hover:bg-slate-700 rounded-full transition-colors">
                <i data-feather="arrow-left"></i>
            </a>
            <h1 class="text-2xl font-bold flex gap-2 items-center">
                <i data-feather="mic" class="text-indigo-400"></i> Talk to Misty
            </h1>
        </div>
        <div class="flex flex-col items-end">
            <span id="status" class="text-sm font-black tracking-widest text-indigo-400">IDLE</span>
            <p class="text-[10px] text-slate-500 uppercase">Gemini 1.5 Flash System</p>
        </div>
    </div>

    <div id="chat-container" class="flex-1 w-full max-w-5xl mx-auto p-8 overflow-y-auto space-y-6">
        <div class="flex flex-col items-start">
            <div class="bg-slate-800 p-4 rounded-2xl rounded-tl-none border border-slate-700 max-w-[70%]">
                <p id="intro-message" class="text-slate-300">Hi! I'm Misty. Hold the microphone button below to ask me anything about Franklin & Marshall!</p>
            </div>
        </div>
    </div>

    <div class="w-full p-10 bg-gradient-to-t from-slate-900 via-slate-900 to-transparent flex flex-col items-center gap-4">
        <button id="mic-btn" 
            class="w-24 h-24 bg-indigo-600 rounded-full flex items-center justify-center shadow-[0_0_30px_rgba(79,70,229,0.4)] hover:bg-indigo-500 hover:scale-105 transition-all active:scale-90 select-none touch-none">
            <i data-feather="mic" class="w-10 h-10 text-white"></i>
        </button>
        <p id="instruction" class="text-sm text-slate-400 font-bold uppercase tracking-tighter">Press and Hold to Speak</p>
    </div>

    <script>
        feather.replace();
        const micBtn = document.getElementById('mic-btn');
        const status = document.getElementById('status');
        const chat = document.getElementById('chat-container');
        const instruction = document.getElementById('instruction');

        function initGeminiPage() {
            logInteraction("PAGE_ENTER", "User entered Gemini Chat Interface");
            autoIntro();
        }

        function autoIntro() {
            const introText = document.getElementById('intro-message').innerText;
            setTimeout(() => {
                // Use global speakText to ensure logging
                speakText(introText);
            }, 1000);
        }

        // --- UPDATED LISTENERS WITH COMPREHENSIVE LOGGING ---
        micBtn.onmousedown = micBtn.ontouchstart = (e) => {
            e.preventDefault(); 
            
            // Log that the user is attempting to speak
            logInteraction("MIC_HOLD_START", "User opened microphone");
            
            // Interrupt Misty immediately
            stopSpeech(); 

            status.innerText = "LISTENING...";
            status.classList.replace('text-indigo-400', 'text-red-500');
            instruction.innerText = "Misty is listening...";
            micBtn.classList.add('ring-4', 'ring-red-500/50', 'bg-red-600');
            
            fetch('/misty/start_listening', { method: 'POST' });
        };

        micBtn.onmouseup = micBtn.onmouseleave = micBtn.ontouchend = () => {
            if (status.innerText === "LISTENING...") {
                logInteraction("MIC_HOLD_END", "User released microphone");
                
                status.innerText = "THINKING...";
                status.classList.replace('text-red-500', 'text-amber-400');
                instruction.innerText = "Generating response...";
                micBtn.classList.remove('ring-4', 'ring-red-500/50', 'bg-red-600');

                fetch('/misty/stop_and_process', { method: 'POST' })
                    .then(res => res.json())
                    .then(data => {
                        // LOG THE FULL CONVERSATION DATA
                        logInteraction("GEMINI_EXCHANGE", `User: "${data.user_text}" | Misty: "${data.misty_reply}"`);

                        status.innerText = "IDLE";
                        status.classList.remove('text-amber-400');
                        status.classList.add('text-indigo-400');
                        instruction.innerText = "Press and Hold to Speak";
                        
                        // Update UI with User Text
                        chat.innerHTML += `
                            <div class="flex flex-col items-end w-full animate-in fade-in slide-in-from-right-4 duration-300">
                                <div class="bg-indigo-600 p-4 rounded-2xl rounded-tr-none max-w-[70%] shadow-lg">
                                    <p class="text-md">${data.user_text}</p>
                                </div>
                            </div>
                        `;
                        
                        // Update UI with Misty Response
                        setTimeout(() => {
                            chat.innerHTML += `
                                <div class="flex flex-col items-start w-full animate-in fade-in slide-in-from-left-4 duration-300">
                                    <div class="bg-slate-800 p-4 rounded-2xl rounded-tl-none border border-slate-700 max-w-[70%] shadow-lg">
                                        <p class="font-black text-indigo-400 text-xs mb-2 uppercase tracking-widest">Misty</p>
                                        <p class="text-md leading-relaxed">${data.misty_reply}</p>
                                    </div>
                                </div>
                            `;
                            chat.scrollTop = chat.scrollHeight;
                        }, 500);
                        
                        chat.scrollTop = chat.scrollHeight;
                    })
                    .catch(err => {
                        logInteraction("GEMINI_ERROR", err.message);
                        status.innerText = "ERROR";
                        instruction.innerText = "Something went wrong. Try again.";
                    });
            }
        };
    </script>
</body>
</html>
