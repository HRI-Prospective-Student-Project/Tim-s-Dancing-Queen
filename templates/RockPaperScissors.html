<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock • Paper • Scissors | F&M Robotics</title>
    
    <script src="{{ url_for('static', filename='tailwind.min.js') }}"></script>
    <script src="{{ url_for('static', filename='feather.min.js') }}"></script>
    <script src="{{ url_for('static', filename='global.js') }}"></script>

    <script>
        if (window.tailwind) {
            tailwind.config = {
                theme: {
                    extend: {
                        colors: {
                            primary: '#002F6C',
                            accent: '#6366f1'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-sky-50 to-emerald-50 min-h-screen flex flex-col p-6" onload="initRPS()">

    <nav class="bg-white/90 backdrop-blur-md border border-slate-200 rounded-2xl px-6 h-16 flex justify-between items-center shrink-0 shadow-sm relative z-50 mb-8 max-w-5xl mx-auto w-full">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-primary rounded-lg flex items-center justify-center shadow-lg">
                <i data-feather="target" class="text-white w-4 h-4"></i>
            </div>
            <span class="text-lg font-bold tracking-tight text-primary">Franklin & Marshall College 2026</span>
        </div>
        <div class="flex items-center gap-4">
            <a href="javascript:void(0)" onclick="handleNav('Exit to Home', '/home')" class="flex items-center gap-2 hover:text-accent transition-colors">
                <i data-feather="home" class="w-4 h-4"></i>
                <span>Home</span>
            </a>
            <a href="/gemini_misty" onclick="handleNav('RPS: Exit to Gemini')" class="bg-accent text-white px-5 py-2 rounded-full text-sm font-bold flex items-center gap-2 transition-all hover:scale-105 shadow-md">
                <i data-feather="sparkles" class="w-4 h-4 text-yellow-300"></i> Ask Gemini
            </a>
        </div>
    </nav>

    <main class="w-full max-w-3xl mx-auto flex-1">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-extrabold tracking-tight text-slate-900">Rock • Paper • Scissors</h1>
            <p class="text-slate-600 mt-2 font-medium">First to 3 wins! Watch Misty for the countdown.</p>
        </header>

        <section class="grid grid-cols-2 gap-4 mb-6">
            <div class="rounded-2xl bg-white shadow-sm p-5 border border-slate-200 text-center">
                <h2 class="text-xs uppercase tracking-widest text-slate-500 font-black">Player</h2>
                <p id="playerScore" class="text-5xl font-black text-slate-900">0</p>
            </div>
            <div class="rounded-2xl bg-white shadow-sm p-5 border border-slate-200 text-center">
                <h2 class="text-xs uppercase tracking-widest text-slate-500 font-black">Misty</h2>
                <p id="cpuScore" class="text-5xl font-black text-slate-900">0</p>
            </div>
        </section>

        <section id="resultBanner" class="rounded-2xl bg-white shadow-md p-5 border border-indigo-100 mb-6 hidden">
            <p id="roundResult" class="text-xl font-black text-primary"></p>
            <p id="roundDetail" class="text-slate-600 font-medium"></p>
        </section>

        <section class="grid grid-cols-3 gap-4 mb-8">
            <button data-move="rock" class="choice group rounded-3xl bg-white shadow-sm border border-slate-200 p-8 flex flex-col items-center gap-3 transition-all active:scale-90">
                <span class="text-6xl group-hover:scale-110 transition-transform">✊</span>
                <span class="font-black uppercase tracking-widest text-xs">Rock</span>
            </button>
            <button data-move="paper" class="choice group rounded-3xl bg-white shadow-sm border border-slate-200 p-8 flex flex-col items-center gap-3 transition-all active:scale-90">
                <span class="text-6xl group-hover:scale-110 transition-transform">✋</span>
                <span class="font-black uppercase tracking-widest text-xs">Paper</span>
            </button>
            <button data-move="scissors" class="choice group rounded-3xl bg-white shadow-sm border border-slate-200 p-8 flex flex-col items-center gap-3 transition-all active:scale-90">
                <span class="text-6xl group-hover:scale-110 transition-transform">✌️</span>
                <span class="font-black uppercase tracking-widest text-xs">Scissors</span>
            </button>
        </section>

        <section class="grid md:grid-cols-2 gap-6">
            <div class="rounded-2xl bg-white shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-3 bg-slate-50 border-b border-slate-200 flex items-center gap-2">
                    <i data-feather="clock" class="w-3 h-3 text-slate-400"></i>
                    <h3 class="font-black text-[10px] uppercase tracking-widest text-slate-500">Match Log</h3>
                </div>
                <ol id="history" class="max-h-40 overflow-auto p-4 space-y-2 text-xs font-medium"></ol>
            </div>
            <div class="flex flex-col gap-4">
                <div class="p-5 rounded-2xl bg-white shadow-sm border border-slate-200">
                    <h3 class="font-black text-[10px] uppercase tracking-widest text-slate-500 mb-1">Status</h3>
                    <p id="gameStatus" class="text-slate-700 font-bold">First player to 3 wins!</p>
                </div>
                <button id="resetBtn" class="w-full py-4 rounded-2xl bg-slate-900 text-white font-black uppercase tracking-widest text-xs shadow-lg hover:bg-primary transition-colors flex items-center justify-center gap-2">
                    <i data-feather="refresh-cw" class="w-4 h-4"></i> Reset Game
                </button>
            </div>
        </section>
    </main>

    <script>
        let player = 0, cpu = 0;
        const beats = { rock: 'scissors', paper: 'rock', scissors: 'paper' };
        
        const playerEl = document.getElementById('playerScore');
        const cpuEl = document.getElementById('cpuScore');
        const historyEl = document.getElementById('history');
        const gameStatusEl = document.getElementById('gameStatus');
        const resultBanner = document.getElementById('resultBanner');

        function initRPS() {
            if (typeof feather !== 'undefined') feather.replace();
            mistySpeak("Let's play rock paper scissors! First to three wins. Choose your move to start the game!");
        }

        async function mistySpeak(text) {
            await fetch("/speak", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ 
                    text: text,
                    sessionId: localStorage.getItem('misty_session_id') || 'NO_SESS'
                })
            });
        }

        async function playRound(playerMove) {
            if (player >= 3 || cpu >= 3) return;
            disableChoices(true);
            resultBanner.classList.add('hidden');

            // 1. Start the request to Misty
            const response = await fetch("/RockPaperScissors", { 
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ sessionId: localStorage.getItem('misty_session_id') || 'NO_SESS' })
            });
            const data = await response.json();
            const c = data.misty_choice.toLowerCase();

            // 2. IMMEDIATE LOGIC (Don't wait!)
            // We calculate this the moment the data hits the browser
            let roundSpeech = "";
            if (playerMove === c) {
                showResult('Tie 🤝', `Both picked ${c}.`);
                roundSpeech = "It is a tie!";
            } else if (beats[playerMove] === c) {
                player++;
                showResult('You Win! ✅', `${playerMove} beats ${c}.`);
                roundSpeech = "You won this round!";
            } else {
                cpu++;
                showResult('Misty Wins! ❌', `${c} beats ${playerMove}.`);
                roundSpeech = "I won this round!";
            }

            // 3. Update the Scoreboard instantly
            updateUI();

            // 4. Final Commentary
            if (player >= 3 || cpu >= 3) {
                const finalWinnerSpeech = (player >= 3) 
                    ? "You win the game! Congratulations! Yay!" 
                    : "I win the game! Better luck next time! Muah-ha-ha!";
                
                gameStatusEl.innerHTML = player >= 3 
                    ? "<span class='text-emerald-600 font-black animate-bounce'>MATCH OVER: YOU WON! 🎉</span>" 
                    : "<span class='text-red-600 font-black animate-pulse'>MATCH OVER: MISTY WON! 🤖</span>";
                
                mistySpeak(finalWinnerSpeech);

                // MAKE RESET BUTTON RED AND BOLD
                const btn = document.getElementById('resetBtn');
                btn.classList.remove('bg-slate-900');
                btn.classList.add('bg-red-600', 'ring-4', 'ring-red-200', 'animate-pulse', 'scale-105');
                btn.innerHTML = '<i data-feather="refresh-cw" class="w-4 h-4"></i> START NEW MATCH';
                if (typeof feather !== 'undefined') feather.replace();
                
            } else {
                mistySpeak(roundSpeech);
                disableChoices(false); 
            }
        }

        function showResult(title, detail) {
            resultBanner.classList.remove('hidden');
            document.getElementById('roundResult').textContent = title;
            document.getElementById('roundDetail').textContent = detail;
            const li = document.createElement('li');
            li.className = "p-2 bg-white border border-slate-100 rounded-lg shadow-sm";
            li.innerHTML = `<span class="font-black text-primary">${title}:</span> ${detail}`;
            historyEl.prepend(li);
        }

        function updateUI() {
            playerEl.textContent = player;
            cpuEl.textContent = cpu;
        }

        function disableChoices(val) {
            document.querySelectorAll('.choice').forEach(b => {
                b.disabled = val;
                b.style.opacity = val ? "0.4" : "1";
                b.style.pointerEvents = val ? "none" : "auto";
            });
        }

        document.querySelectorAll('.choice').forEach(b => {
            b.addEventListener('click', () => playRound(b.dataset.move));
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            player = 0; cpu = 0;
            updateUI();
            historyEl.innerHTML = '';
            resultBanner.classList.add('hidden');
            gameStatusEl.textContent = "First player to 3 wins!";
            
            // RESET BUTTON STYLE
            const btn = document.getElementById('resetBtn');
            btn.classList.remove('bg-red-600', 'ring-4', 'ring-red-200', 'animate-pulse', 'scale-105');
            btn.classList.add('bg-slate-900');
            btn.innerHTML = '<i data-feather="refresh-cw" class="w-4 h-4"></i> Reset Game';
            if (typeof feather !== 'undefined') feather.replace();

            disableChoices(false);
            mistySpeak("New game! First to three wins.");
        });
    </script>
</body>
</html>
