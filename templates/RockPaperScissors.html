<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rock • Paper • Scissors</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#0f172a',
            accent: '#6366f1'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-sky-50 to-emerald-50 min-h-screen flex items-center justify-center p-6">
  <main class="w-full max-w-3xl">
    <header class="text-center mb-8">
      <h1 class="text-4xl font-extrabold tracking-tight text-primary">Rock • Paper • Scissors</h1>
      <p class="text-slate-600 mt-2">First to 3 wins! Watch Misty for the countdown.</p>
    </header>

    <section class="grid grid-cols-2 gap-4 mb-6">
      <div class="rounded-2xl bg-white shadow p-5 border border-slate-100 text-center">
        <h2 class="text-sm uppercase tracking-wider text-slate-500">You</h2>
        <p id="playerScore" class="text-4xl font-bold">0</p>
      </div>
      <div class="rounded-2xl bg-white shadow p-5 border border-slate-100 text-center">
        <h2 class="text-sm uppercase tracking-wider text-slate-500">Misty</h2>
        <p id="cpuScore" class="text-4xl font-bold">0</p>
      </div>
    </section>

    <section id="cpuAnim" class="rounded-2xl bg-white shadow p-8 border border-slate-100 mb-6 hidden text-center">
      <p id="animStatus" class="text-xl font-bold text-accent uppercase tracking-widest mb-4">Ready...</p>
      <div class="flex justify-center">
        <div id="cpuEmoji" class="text-8xl transition-all duration-200 transform scale-110">✊</div>
      </div>
    </section>

    <section id="resultBanner" class="rounded-2xl bg-white shadow p-5 border border-slate-100 mb-6 hidden">
      <p id="roundResult" class="text-lg font-bold text-primary"></p>
      <p id="roundDetail" class="text-slate-600"></p>
    </section>

    <section class="grid grid-cols-3 gap-4 mb-8">
      <button data-move="rock" class="choice group rounded-2xl bg-white shadow hover:shadow-lg border border-slate-100 p-6 flex flex-col items-center gap-3 transition active:scale-95">
        <span class="text-5xl">✊</span>
        <span class="font-bold">Rock</span>
      </button>
      <button data-move="paper" class="choice group rounded-2xl bg-white shadow hover:shadow-lg border border-slate-100 p-6 flex flex-col items-center gap-3 transition active:scale-95">
        <span class="text-5xl">✋</span>
        <span class="font-bold">Paper</span>
      </button>
      <button data-move="scissors" class="choice group rounded-2xl bg-white shadow hover:shadow-lg border border-slate-100 p-6 flex flex-col items-center gap-3 transition active:scale-95">
        <span class="text-5xl">✌️</span>
        <span class="font-bold">Scissors</span>
      </button>
    </section>

    <section class="grid md:grid-cols-2 gap-4">
      <div class="rounded-2xl bg-white shadow border border-slate-100 overflow-hidden">
        <div class="p-4 bg-slate-50 border-b border-slate-100">
          <h3 class="font-bold text-sm text-slate-700">Round History</h3>
        </div>
        <ol id="history" class="max-h-48 overflow-auto p-4 space-y-2 text-sm"></ol>
      </div>
      <div class="flex flex-col gap-4">
        <div class="p-5 rounded-2xl bg-white shadow border border-slate-100">
          <h3 class="font-bold">Game Status</h3>
          <p id="gameStatus" class="text-slate-600">First player to 3 wins!</p>
        </div>
        <button id="resetBtn" class="w-full py-3 rounded-xl bg-accent text-white font-bold shadow hover:opacity-90 transition">Reset Game</button>
      </div>
    </section>
  </main>

  <script>
    let player = 0, cpu = 0;
    const beats = { rock: 'scissors', paper: 'rock', scissors: 'paper' };
    const emojis = { rock: '✊', paper: '✋', scissors: '✌️' };

    const playerEl = document.getElementById('playerScore');
    const cpuEl = document.getElementById('cpuScore');
    const historyEl = document.getElementById('history');
    const gameStatusEl = document.getElementById('gameStatus');
    const resultBanner = document.getElementById('resultBanner');
    const cpuAnim = document.getElementById('cpuAnim');
    const cpuEmoji = document.getElementById('cpuEmoji');
    const animStatus = document.getElementById('animStatus');

    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

    async function mistyStart() {
      // Calls the POST route in your Flask app
      const r = await fetch("/RockPaperScissors", { method: "POST" });
      const d = await r.json();
      return d.misty_choice.toLowerCase();
    }

    async function runSyncAnimation(mistyChoice) {
      cpuAnim.classList.remove('hidden');
      resultBanner.classList.add('hidden');

      const steps = ['Rock', 'Paper', 'Scissors'];
      const cycleEmojis = ['✊', '✋', '✌️'];

      // LOOP: Sycned with the 0.8s time.sleep in Python
      for (let i = 0; i < steps.length; i++) {
        animStatus.textContent = steps[i] + "...";
        cpuEmoji.textContent = cycleEmojis[i];
        // Visual "pump" effect
        cpuEmoji.style.transform = "scale(1.3)";
        setTimeout(() => cpuEmoji.style.transform = "scale(1)", 200);
        
        await sleep(1200); 
      }

      // REVEAL: Matches Misty's "Shoot!"
      animStatus.textContent = "SHOOT!";
      cpuEmoji.textContent = emojis[mistyChoice];
      cpuEmoji.style.transform = "scale(1.5)";
      
      await sleep(1000);
      cpuAnim.classList.add('hidden');
    }

    async function playRound(playerMove) {
      if (player >= 3 || cpu >= 3) return;
      
      disableChoices(true);
      
      // 1. Get Misty's choice (this triggers the Flask sequence/Misty's voice)
      const c = await mistyStart(); 

      // 2. Run the UI countdown (This takes 2.4 seconds: 3 steps * 800ms)
      await runSyncAnimation(c); 

      // --- THE DELAY HAPPENS HERE ---
      // We pause for an extra 500ms so the user can look at Misty's hand 
      // before the website reveals the text result.
      await sleep(1200); 

      // 3. Process Scoring
      if (playerMove === c) {
        showResult('Tie 🤝', `Both picked ${c}.`);
      } else if (beats[playerMove] === c) {
        player++;
        showResult('You Win! ✅', `${playerMove} beats ${c}.`);
      } else {
        cpu++;
        showResult('Misty Wins! ❌', `${c} beats ${playerMove}.`);
      }

      updateUI();
      
      // Check if the game is over (First to 3)
      if (player < 3 && cpu < 3) {
        disableChoices(false);
      } else {
        // Keep choices disabled if someone reached 3
        disableChoices(true);
        gameStatusEl.textContent = player >= 3 ? "Game Over: You Won! 🎉" : "Game Over: Misty Won! 🤖";
      }
    }

    function showResult(title, detail) {
      resultBanner.classList.remove('hidden');
      document.getElementById('roundResult').textContent = title;
      document.getElementById('roundDetail').textContent = detail;
      const li = document.createElement('li');
      li.className = "p-2 bg-slate-50 border rounded";
      li.textContent = `${title}: ${detail}`;
      historyEl.prepend(li);
    }

    function updateUI() {
      playerEl.textContent = player;
      cpuEl.textContent = cpu;
      if (player >= 3) gameStatusEl.textContent = "Victory! You beat Misty! 🎉";
      else if (cpu >= 3) gameStatusEl.textContent = "Misty wins the match! 🤖";
    }

    function disableChoices(val) {
      document.querySelectorAll('.choice').forEach(b => {
        b.disabled = val;
        b.style.opacity = val ? "0.5" : "1";
      });
    }

    document.querySelectorAll('.choice').forEach(b => {
      b.addEventListener('click', () => playRound(b.dataset.move));
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      player = 0; cpu = 0;
      updateUI();
      historyEl.innerHTML = '';
      resultBanner.classList.add('hidden');
      gameStatusEl.textContent = "First player to 3 wins!";
      disableChoices(false);
    });
  </script>
</body>
</html>
