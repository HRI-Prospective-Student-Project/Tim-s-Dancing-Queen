<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rock • Paper • Scissors</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#0f172a',
            accent: '#6366f1'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-sky-50 to-emerald-50 min-h-screen flex items-center justify-center p-6">
  <main class="w-full max-w-3xl">
    <header class="text-center mb-8">
      <h1 class="text-4xl font-extrabold tracking-tight text-primary">Rock • Paper • Scissors</h1>
      <p class="text-slate-600 mt-2">First to 3 wins! Choose your move below.</p>
    </header>

    <section class="grid grid-cols-2 gap-4 mb-6">
      <div class="rounded-2xl bg-white shadow p-5 border border-slate-100">
        <h2 class="text-sm uppercase tracking-wider text-slate-500">You</h2>
        <p id="playerScore" class="text-4xl font-bold">0</p>
      </div>
      <div class="rounded-2xl bg-white shadow p-5 border border-slate-100">
        <h2 class="text-sm uppercase tracking-wider text-slate-500">Misty</h2>
        <p id="cpuScore" class="text-4xl font-bold">0</p>
      </div>
    </section>

    <section id="cpuAnim" class="rounded-2xl bg-white shadow p-5 border border-slate-100 mb-6 hidden text-center">
      <p id="animStatus" class="text-sm uppercase tracking-wider text-slate-500 mb-2">Misty is ready...</p>
      <div class="flex flex-col items-center gap-3">
        <div id="cpuEmoji" class="text-6xl leading-none select-none">✊</div>
      </div>
    </section>

    <section id="resultBanner" class="rounded-2xl bg-white shadow p-5 border border-slate-100 mb-6 hidden">
      <p id="roundResult" class="text-lg font-semibold"></p>
      <p id="roundDetail" class="text-slate-600"></p>
    </section>

    <section class="grid grid-cols-3 gap-4 mb-8" aria-label="Choose your move">
      <button data-move="rock" class="choice group rounded-2xl bg-white shadow hover:shadow-lg border border-slate-100 p-6 flex flex-col items-center gap-3 transition active:scale-[0.98] focus:outline-none focus:ring-4 focus:ring-indigo-200">
        <span class="text-5xl leading-none" aria-hidden="true">✊</span>
        <span class="font-semibold">Rock</span>
        <span class="text-xs text-slate-500">Beats Scissors</span>
      </button>
      <button data-move="paper" class="choice group rounded-2xl bg-white shadow hover:shadow-lg border border-slate-100 p-6 flex flex-col items-center gap-3 transition active:scale-[0.98] focus:outline-none focus:ring-4 focus:ring-indigo-200">
        <span class="text-5xl leading-none" aria-hidden="true">✋</span>
        <span class="font-semibold">Paper</span>
        <span class="text-xs text-slate-500">Beats Rock</span>
      </button>
      <button data-move="scissors" class="choice group rounded-2xl bg-white shadow hover:shadow-lg border border-slate-100 p-6 flex flex-col items-center gap-3 transition active:scale-[0.98] focus:outline-none focus:ring-4 focus:ring-indigo-200">
        <span class="text-5xl leading-none" aria-hidden="true">✌️</span>
        <span class="font-semibold">Scissors</span>
        <span class="text-xs text-slate-500">Beats Paper</span>
      </button>
    </section>

    <section class="grid md:grid-cols-2 gap-4 items-start">
      <div class="rounded-2xl bg-white shadow border border-slate-100">
        <div class="p-5 border-b border-slate-100">
          <h3 class="font-semibold">Round History</h3>
          <p class="text-xs text-slate-500">Newest on top</p>
        </div>
        <ol id="history" class="max-h-64 overflow-auto p-4 space-y-2" aria-live="polite"></ol>
      </div>
      <div class="rounded-2xl bg-white shadow p-5 border border-slate-100 flex flex-col gap-4">
        <div>
          <h3 class="font-semibold">Game Status</h3>
          <p id="gameStatus" class="text-slate-600">First to 3 — make your move.</p>
        </div>
        <div class="flex flex-col gap-2">
          <button id="resetBtn" class="px-4 py-2 rounded-xl bg-accent text-white font-semibold shadow hover:shadow-lg transition active:scale-[0.98]">Reset</button>
          <a href="/" class="px-4 py-2 rounded-xl bg-slate-200 text-slate-700 font-semibold shadow hover:shadow-lg transition text-center">
            ← Go Home
          </a>
        </div>
      </div>
    </section>
  </main>

  <script>
    // --- Game State ---
    let player = 0;
    let cpu = 0;
    const choices = ['rock', 'paper', 'scissors'];
    const beats = { rock: 'scissors', paper: 'rock', scissors: 'paper' };

    const playerEl = document.getElementById('playerScore');
    const cpuEl = document.getElementById('cpuScore');
    const historyEl = document.getElementById('history');
    const gameStatusEl = document.getElementById('gameStatus');
    const resultBanner = document.getElementById('resultBanner');
    const roundResult = document.getElementById('roundResult');
    const roundDetail = document.getElementById('roundDetail');
    const resetBtn = document.getElementById('resetBtn');
    const cpuAnim = document.getElementById('cpuAnim');
    const cpuEmoji = document.getElementById('cpuEmoji');
    const animStatus = document.getElementById('animStatus');

    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
    function fmt(move) { return move.charAt(0).toUpperCase() + move.slice(1); }

    function updateScores() {
      playerEl.textContent = player;
      cpuEl.textContent = cpu;
    }

    function banner(show, main = '', detail = '') {
      resultBanner.classList.toggle('hidden', !show);
      roundResult.textContent = main;
      roundDetail.textContent = detail;
    }

    function appendHistory(text) {
      const li = document.createElement('li');
      li.className = 'text-sm text-slate-700 bg-slate-50 border border-slate-200 rounded-lg p-2';
      li.textContent = text;
      historyEl.prepend(li);
    }

    function disableChoices(disabled) {
      document.querySelectorAll('.choice').forEach(btn => {
        btn.disabled = disabled;
        btn.classList.toggle('opacity-50', disabled);
        btn.classList.toggle('cursor-not-allowed', disabled);
      });
    }

    function isGameOver() { return player === 3 || cpu === 3; }

    function winnerText() {
      if (player > cpu) return 'You win the game! 🎉';
      if (cpu > player) return 'Misty wins the game! 🤖';
      return 'Draw!';
    }

    // --- Core Logic: Triggering Misty & Syncing Animation ---

    async function mistyStart() {
      // Calls your Flask route which handles physical head-pumping
      const response = await fetch("/RockPaperScissors", {
          method: "POST",
          headers: {"Content-Type": "application/json"}
      });
      const data = await response.json();
      return data.misty_choice.toLowerCase();
    }

    async function showCpuAnimation(finalMove) {
      cpuAnim.classList.remove('hidden');
      banner(false); // Hide old banner during countdown

      // Shuffle cycle: Matches Misty's "Rock... Paper... Scissors..." timing (800ms per beat)
      const countdownSteps = ['Rock', 'Paper', 'Scissors'];
      const emojis = ['✊', '✋', '✌️'];

      for (let i = 0; i < countdownSteps.length; i++) {
        animStatus.textContent = countdownSteps[i] + "...";
        cpuEmoji.textContent = emojis[i];
        await sleep(800); // SYNCED with Python time.sleep(0.8)
      }

      // "Shoot!" Reveal
      animStatus.textContent = "SHOOT!";
      cpuEmoji.textContent = finalMove === 'rock' ? '✊' : finalMove === 'paper' ? '✋' : '✌️';
      
      await sleep(1500); 
      cpuAnim.classList.add('hidden');
    }

    async function playRound(playerMove) {
      if (isGameOver()) return;

      disableChoices(true);
      
      // 1. Kick off the physical robot countdown and get choice
      const c = await mistyStart(); 

      // 2. Kick off the UI countdown (Visual Sync)
      await showCpuAnimation(c); 

      // 3. Logic & Scoring
      if (playerMove === c) {
        banner(true, 'Tie 🤝', `${fmt(playerMove)} ties ${fmt(c)}.`);
        appendHistory(`Tie — You: ${fmt(playerMove)} | Misty: ${fmt(c)}`);
      } else if (beats[playerMove] === c) {
        player++;
        banner(true, 'You win this round! ✅', `${fmt(playerMove)} beats ${fmt(c)}.`);
        appendHistory(`Win — ${fmt(playerMove)} beats ${fmt(c)}.`);
      } else {
        cpu++;
        banner(true, 'You lose this round ❌', `${fmt(c)} beats ${fmt(playerMove)}.`);
        appendHistory(`Loss — ${fmt(c)} beats ${fmt(playerMove)}.`);
      }

      updateScores();

      if (isGameOver()) {
        gameStatusEl.textContent = winnerText();
        disableChoices(true);
      } else {
        gameStatusEl.textContent = "First to 3. Keep going!";
        disableChoices(false);
      }
    }

    function resetGame() {
      player = 0; cpu = 0;
      updateScores();
      historyEl.innerHTML = '';
      banner(false);
      disableChoices(false);
      gameStatusEl.textContent = 'First to 3 — make your move.';
      cpuAnim.classList.add('hidden');
    }

    // Event Listeners
    document.querySelectorAll('.choice').forEach(btn => {
      btn.addEventListener('click', () => playRound(btn.dataset.move));
    });

    resetBtn.addEventListener('click', resetGame);

    // Initial state
    resetGame();
  </script>
</body>
</html>
